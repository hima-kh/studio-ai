version: '3.8'\n\nservices:\n  studio-ai:\n    build: .\n    container_name: studio-ai\n    ports:\n      - \"3000:3000\"\n      - \"5000:5000\"\n    volumes:\n      - ./outputs:/app/outputs\n      - ./uploads:/app/uploads\n      - ./models:/app/models\n    environment:\n      - NODE_ENV=production\n      - PORT=5000\n      - FRONTEND_URL=http://localhost:3000\n      - USE_GPU=false\n    restart: unless-stopped\n    networks:\n      - studio-ai-network\n\n  redis:\n    image: redis:7-alpine\n    container_name: studio-ai-redis\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis-data:/data\n    restart: unless-stopped\n    networks:\n      - studio-ai-network\n\nvolumes:\n  redis-data:\n\nnetworks:\n  studio-ai-network:\n    driver: bridge\n"
